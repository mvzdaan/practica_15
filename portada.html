<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Día de Muertos — Portada</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #2c003e, #1a002b, #000);
            overflow-x: hidden;
            font-family: 'Georgia', serif;
            color: #fff;
        }

        /* Contenedor de telarañas */
        .spiderwebs-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .spiderweb {
            position: absolute;
            opacity: 0.25;
        }

        .sw1 { top: 0; left: 5%; width: 280px; animation: sway 7s ease-in-out infinite; }
        .sw2 { top: 0; right: 5%; width: 320px; animation: sway 8s ease-in-out infinite reverse; }
        .sw3 { top: 15%; left: 2%; width: 200px; animation: sway 6s ease-in-out infinite; }
        .sw4 { top: 10%; right: 3%; width: 240px; animation: sway 9s ease-in-out infinite reverse; }

        @keyframes sway {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(2deg); }
        }

        /* Araña */
        .spider {
            position: absolute;
            top: 0;
            left: 10%;
            width: 30px;
            animation: crawl 12s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes crawl {
            0% { transform: translateY(0); }
            50% { transform: translateY(120px); }
            100% { transform: translateY(0); }
        }

        /* Contenido central */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            text-align: center;
        }

        .frame {
            border: 4px solid #ff6b35;
            border-radius: 12px;
            padding: 3rem 4rem;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 
                0 0 25px rgba(255, 107, 53, 0.4),
                inset 0 0 25px rgba(138, 43, 226, 0.3);
            max-width: 90%;
        }

        h1 {
            font-size: 3.5rem;
            color: #ffd700;
            text-shadow: 0 0 12px #ff6b35, 0 0 24px #ff6b35;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .subtitulo {
            font-size: 1.4rem;
            color: #ffb347;
            margin-bottom: 2rem;
            font-style: italic;
        }

        .decoracion {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 1.5rem 0;
            flex-wrap: wrap;
        }

        .calavera {
            width: 70px;
            filter: drop-shadow(0 0 6px #ffd700);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 6px #ffd700); }
            to { filter: drop-shadow(0 0 14px #ff6b35); }
        }

        .flor {
            width: 60px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .mensaje {
            margin-top: 1.5rem;
            font-size: 1.1rem;
            color: #e0c5ff;
            max-width: 600px;
            line-height: 1.6;
        }

        /* Velas resplandecientes */
        .velas {
            position: absolute;
            bottom: 2rem;
            display: flex;
            gap: 4rem;
        }

        .vela {
            width: 24px;
            height: 60px;
            background: linear-gradient(to bottom, #f5e6d3, #d4a76a);
            border-radius: 3px;
            position: relative;
        }

        .llama {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 20px;
            background: radial-gradient(ellipse at bottom, #ffd700, #ff6b35, transparent);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: flame 0.8s ease-in-out infinite alternate;
            filter: blur(1px);
        }

        @keyframes flame {
            0% { transform: translateX(-50%) scale(1, 1); }
            100% { transform: translateX(-50%) scale(0.9, 1.15); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .frame { padding: 2rem; }
        }
    </style>
</head>
<body>
    <!-- Telarañas -->
    <div class="spiderwebs-container">
        <svg class="spiderweb sw1" viewBox="0 0 300 200">
            <path d="M0,0 L150,100 L300,0 Z" fill="none" stroke="#fff" stroke-width="1"/>
            <line x1="150" y1="100" x2="75" y2="25" stroke="#fff" stroke-width="1"/>
            <line x1="150" y1="100" x2="225" y2="25" stroke="#fff" stroke-width="1"/>
            <line x1="150" y1="100" x2="150" y2="33" stroke="#fff" stroke-width="1"/>
            <path d="M75,25 Q150,50 225,25" fill="none" stroke="#fff" stroke-width="1"/>
            <path d="M100,50 Q150,70 200,50" fill="none" stroke="#fff" stroke-width="1"/>
            <path d="M125,75 Q150,90 175,75" fill="none" stroke="#fff" stroke-width="1"/>
        </svg>
        <svg class="spiderweb sw2" viewBox="0 0 300 200">
            <path d="M0,0 L150,100 L300,0 Z" fill="none" stroke="#fff" stroke-width="1"/>
            <line x1="150" y1="100" x2="75" y2="25" stroke="#fff" stroke-width="1"/>
            <line x1="150" y1="100" x2="225" y2="25" stroke="#fff" stroke-width="1"/>
            <line x1="150" y1="100" x2="150" y2="33" stroke="#fff" stroke-width="1"/>
            <path d="M75,25 Q150,50 225,25" fill="none" stroke="#fff" stroke-width="1"/>
            <path d="M100,50 Q150,70 200,50" fill="none" stroke="#fff" stroke-width="1"/>
            <path d="M125,75 Q150,90 175,75" fill="none" stroke="#fff" stroke-width="1"/>
        </svg>
        <svg class="spiderweb sw3" viewBox="0 0 200 150">
            <path d="M0,0 L100,75 L200,0 Z" fill="none" stroke="#fff" stroke-width="1"/>
            <line x1="100" y1="75" x2="50" y2="20" stroke="#fff" stroke-width="1"/>
            <line x1="100" y1="75" x2="150" y2="20" stroke="#fff" stroke-width="1"/>
            <path d="M50,20 Q100,40 150,20" fill="none" stroke="#fff" stroke-width="1"/>
            <path d="M75,45 Q100,60 125,45" fill="none" stroke="#fff" stroke-width="1"/>
        </svg>
        <svg class="spiderweb sw4" viewBox="0 0 200 150">
            <path d="M0,0 L100,75 L200,0 Z" fill="none" stroke="#fff" stroke-width="1"/>
            <line x1="100" y1="75" x2="50" y2="20" stroke="#fff" stroke-width="1"/>
            <line x1="100" y1="75" x2="150" y2="20" stroke="#fff" stroke-width="1"/>
            <path d="M50,20 Q100,40 150,20" fill="none" stroke="#fff" stroke-width="1"/>
            <path d="M75,45 Q100,60 125,45" fill="none" stroke="#fff" stroke-width="1"/>
        </svg>
    </div>

    <!-- Araña -->
    <svg class="spider" viewBox="0 0 40 40">
        <ellipse cx="20" cy="22" rx="10" ry="8" fill="#111"/>
        <circle cx="20" cy="14" r="6" fill="#111"/>
        <circle cx="16" cy="12" r="2" fill="#ff3333"/>
        <circle cx="24" cy="12" r="2" fill="#ff3333"/>
        <path d="M10,18 L4,10 M10,22 L2,22 M10,26 L6,34 M30,18 L36,10 M30,22 L38,22 M30,26 L34,34" 
              stroke="#111" stroke-width="2" fill="none"/>
    </svg>

    <!-- Contenido principal -->
    <main class="content">
        <div class="frame">
            <h1>✨ Día de Muertos ✨</h1>
            <p class="subtitulo">Honrando la memoria de nuestros seres queridos</p>
            
            <div class="decoracion">
                <!-- Calavera estilizada -->
                <svg class="calavera" viewBox="0 0 100 100">
                    <ellipse cx="50" cy="45" rx="38" ry="42" fill="#fff"/>
                    <ellipse cx="35" cy="38" rx="10" ry="12" fill="#2c003e"/>
                    <ellipse cx="65" cy="38" rx="10" ry="12" fill="#2c003e"/>
                    <path d="M45,50 L50,58 L55,50" fill="#2c003e"/>
                    <rect x="30" y="68" width="8" height="10" rx="2" fill="#2c003e"/>
                    <rect x="42" y="68" width="8" height="10" rx="2" fill="#2c003e"/>
                    <rect x="54" y="68" width="8" height="10" rx="2" fill="#2c003e"/>
                    <rect x="66" y="68" width="8" height="10" rx="2" fill="#2c003e"/>
                    <circle cx="30" cy="20" r="5" fill="#ff6b35"/>
                    <circle cx="70" cy="20" r="5" fill="#ff6b35"/>
                    <circle cx="20" cy="40" r="4" fill="#ffd700"/>
                    <circle cx="80" cy="40" r="4" fill="#ffd700"/>
                </svg>

                <!-- Flor de cempasúchil -->
                <svg class="flor" viewBox="0 0 80 80">
                    <g transform="translate(40,40)">
                        <ellipse cx="0" cy="-22" rx="9" ry="18" fill="#ff9f1c"/>
                        <ellipse cx="16" cy="-14" rx="9" ry="18" fill="#ffac1c" transform="rotate(45)"/>
                        <ellipse cx="22" cy="0" rx="9" ry="18" fill="#ff9f1c" transform="rotate(90)"/>
                        <ellipse cx="16" cy="14" rx="9" ry="18" fill="#ffac1c" transform="rotate(135)"/>
                        <ellipse cx="0" cy="22" rx="9" ry="18" fill="#ff9f1c" transform="rotate(180)"/>
                        <ellipse cx="-16" cy="14" rx="9" ry="18" fill="#ffac1c" transform="rotate(225)"/>
                        <ellipse cx="-22" cy="0" rx="9" ry="18" fill="#ff9f1c" transform="rotate(270)"/>
                        <ellipse cx="-16" cy="-14" rx="9" ry="18" fill="#ffac1c" transform="rotate(315)"/>
                        <circle cx="0" cy="0" r="10" fill="#e67e00"/>
                    </g>
                </svg>

                <svg class="calavera" viewBox="0 0 100 100">
                    <ellipse cx="50" cy="45" rx="38" ry="42" fill="#fff"/>
                    <ellipse cx="35" cy="38" rx="10" ry="12" fill="#2c003e"/>
                    <ellipse cx="65" cy="38" rx="10" ry="12" fill="#2c003e"/>
                    <path d="M45,50 L50,58 L55,50" fill="#2c003e"/>
                    <rect x="30" y="68" width="8" height="10" rx="2" fill="#2c003e"/>
                    <rect x="42" y="68" width="8" height="10" rx="2" fill="#2c003e"/>
                    <rect x="54" y="68" width="8" height="10" rx="2" fill="#2c003e"/>
                    <rect x="66" y="68" width="8" height="10" rx="2" fill="#2c003e"/>
                    <circle cx="30" cy="20" r="5" fill="#ff6b35"/>
                    <circle cx="70" cy="20" r="5" fill="#ff6b35"/>
                    <circle cx="20" cy="40" r="4" fill="#ffd700"/>
                    <circle cx="80" cy="40" r="4" fill="#ffd700"/>
                </svg>
            </div>

            <p class="mensaje">
                "La muerte no es el final, es el comienzo de un nuevo camino.<br>
                Que la luz de las velas y el aroma del cempasúchil guíen a nuestros seres queridos a casa."
            </p>
        </div>

        <!-- Velas -->
        <div class="velas">
            <div class="vela"><div class="llama"></div></div>
            <div class="vela"><div class="llama"></div></div>
            <div class="vela"><div class="llama"></div></div>
        </div>
    </main>
</body>
</html>
